<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="auth-dark-shell">
    <section class="auth-dark-card">
      <h1>Create your Account</h1>

      <form id="register-form" class="auth-form-dark">
        <div class="field-dark">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="field-dark">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>
        </div>

        <button type="submit" class="primary-btn">Register</button>
      </form>

      <p id="register-status" class="status-dark"></p>

      <p class="switch-line-dark">
        Have an account? <a href="/login">Sign in</a>
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("register-form");
    const statusBox = document.getElementById("register-status");

    async function postJson(url, data) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.detail || "Request failed");
      return payload;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.classList.remove("error");
      statusBox.textContent = "";

      try {
        await postJson("/users/", {
          name: form.email.value.trim().split("@")[0] || "User",
          email: form.email.value.trim(),
          password: form.password.value
        });
        statusBox.textContent = "Account created. Redirecting to login...";
        setTimeout(() => {
          window.location.href = "/login";
        }, 900);
      } catch (error) {
        statusBox.classList.add("error");
        statusBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>

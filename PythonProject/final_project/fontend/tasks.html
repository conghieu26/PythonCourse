<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Workspace</p>
        <h1>Task Manager</h1>
        <p class="lead">Quản lý task đơn giản, rõ ràng và dễ dùng.</p>
      </div>
      <a class="badge" href="/">Home</a>
    </header>

    <section class="layout">
      <section class="card">
        <div class="section-head">
          <h2>Create Task</h2>
          <button type="button" class="ghost" id="refresh-btn">Refresh</button>
        </div>

        <form id="task-form" class="task-form">
          <div class="field span-2">
            <label for="title">Title</label>
            <input id="title" name="title" placeholder="Design dashboard" required>
          </div>

          <div class="field span-2">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Write acceptance criteria..."></textarea>
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="field">
            <label for="due_date">Due date</label>
            <input id="due_date" name="due_date" type="datetime-local">
          </div>

          <div class="actions span-2">
            <button type="submit">Add task</button>
          </div>
        </form>

        <div id="form-status" class="status"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Tasks</h2>
          <span class="muted" id="task-count">0</span>
        </div>
        <div id="task-list" class="task-list"></div>
      </section>
    </section>
  </main>

  <script>
    const API_BASE = "";
    const taskForm = document.getElementById("task-form");
    const taskList = document.getElementById("task-list");
    const taskCount = document.getElementById("task-count");
    const formStatus = document.getElementById("form-status");
    const refreshBtn = document.getElementById("refresh-btn");

    function toIsoString(value) {
      if (!value) return null;
      return new Date(value).toISOString();
    }

    async function request(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.detail || "Request failed");
      }
      return payload;
    }

    function taskTemplate(task) {
      const dueText = task.due_date ? new Date(task.due_date).toLocaleString("vi-VN") : "No deadline";
      const desc = task.description ? `<p>${task.description}</p>` : "<p class=\"muted\">No description</p>";

      return `
        <article class="task-item ${task.completed ? "done" : ""}">
          <div class="task-main">
            <div class="task-top">
              <h3>${task.title}</h3>
              <span class="priority ${task.priority}">${task.priority}</span>
            </div>
            ${desc}
            <div class="meta">
              <span>${dueText}</span>
              <span>${task.completed ? "Completed" : "Open"}</span>
            </div>
          </div>
          <div class="task-actions">
            <button class="secondary" data-action="toggle" data-id="${task.id}">
              ${task.completed ? "Reopen" : "Done"}
            </button>
            <button data-action="delete" data-id="${task.id}">Delete</button>
          </div>
        </article>
      `;
    }

    async function loadTasks() {
      taskList.innerHTML = "<p class='muted'>Loading tasks...</p>";
      const tasks = await request("/tasks/");
      taskCount.textContent = tasks.length;

      if (!tasks.length) {
        taskList.innerHTML = "<p class='muted'>No tasks yet.</p>";
        return;
      }

      taskList.innerHTML = tasks.map(taskTemplate).join("");
    }

    taskForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      formStatus.classList.remove("error");
      formStatus.textContent = "Saving task...";

      try {
        await request("/tasks/", {
          method: "POST",
          body: JSON.stringify({
            title: taskForm.title.value.trim(),
            description: taskForm.description.value.trim() || null,
            priority: taskForm.priority.value,
            due_date: toIsoString(taskForm.due_date.value)
          })
        });

        taskForm.reset();
        taskForm.priority.value = "medium";
        formStatus.textContent = "Task created";
        await loadTasks();
      } catch (error) {
        formStatus.classList.add("error");
        formStatus.textContent = error.message;
      }
    });

    refreshBtn.addEventListener("click", async () => {
      try {
        await loadTasks();
        formStatus.classList.remove("error");
        formStatus.textContent = "";
      } catch (error) {
        formStatus.classList.add("error");
        formStatus.textContent = error.message;
      }
    });

    taskList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      try {
        if (action === "delete") {
          await request(`/tasks/${id}`, { method: "DELETE" });
        }

        if (action === "toggle") {
          const current = await request("/tasks/");
          const task = current.find((item) => String(item.id) === String(id));
          if (!task) return;
          await request(`/tasks/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ completed: !task.completed })
          });
        }

        await loadTasks();
      } catch (error) {
        formStatus.classList.add("error");
        formStatus.textContent = error.message;
      }
    });

    loadTasks().catch((error) => {
      formStatus.classList.add("error");
      formStatus.textContent = error.message;
    });
  </script>
</body>
</html>
